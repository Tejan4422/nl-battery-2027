[project]
name = "nl-battery-2027"
version = "0.1.0"
description = "Hour-by-hour simulation of Dutch household energy costs after the end of net metering (2027)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
entsoe = ["entsoe-py>=0.6", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
